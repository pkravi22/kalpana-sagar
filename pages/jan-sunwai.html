<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>जनसुनवाई | Kalpana Sonkar</title>
    <link rel="stylesheet" href="../assets/css/theme.css" />
    <style>
      body {
        background: var(--sand-bg);
      }

      .page-shell {
        padding: 32px 0 80px;
      }

      .headline {
        text-align: center;
        margin-bottom: 30px;
      }

      .headline h1 {
        font-size: clamp(2.2rem, 4vw, 4rem);
        margin: 0 0 10px;
      }

      .form-card {
        background: var(--card-bg);
        border: 1px solid rgba(16, 24, 39, 0.08);
        border-radius: 20px;
        padding: 28px;
        max-width: 820px;
        margin: 0 auto;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(220px, 1fr));
        gap: 16px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        font-weight: 700;
      }

      input, textarea, select {
        border: 1px solid rgba(16, 24, 39, 0.14);
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
      }

      textarea {
        resize: vertical;
        min-height: 120px;
      }

      @media (max-width: 760px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container navbar">
        <div class="brand"><strong>कल्पना सोनकर</strong></div>
        <nav>
          <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#vision">Vision</a></li>
            <li><a href="jan-sunwai.html">जनसुनवाई</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="page-shell container">
      <section class="headline">
        <div class="badge">जनसुनवाई</div>
        <h1>जनता की आवाज़, शासन तक पहुँच</h1>
      </section>

      <section class="form-card">
        <form class="form-grid">
          <div class="field">
            <label for="name">नाम</label>
            <input id="name" type="text" placeholder="आपका नाम" />
          </div>

          <div class="field">
            <label for="mobile">मोबाइल नंबर</label>
            <input id="mobile" type="tel" placeholder="मोबाइल नंबर" />
          </div>

          <div class="field full">
            <label for="subject">विषय</label>
            <input id="subject" type="text" placeholder="समस्या / सुझाव / सेवा" />
          </div>

          <div class="field full">
            <label for="message">संदेश</label>
            <textarea id="message" placeholder="अपना संदेश लिखें"></textarea>
          </div>

          <div class="field full">
            <button class="btn btn-primary" type="submit">आवेदन जमा करें</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
