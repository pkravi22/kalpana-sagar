<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalpana Sonkar | Hero Section</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #fff4d6 0%, #f8d665 18%, #fefefe 35%, #eaf3ff 100%);
        color: #111827;
      }

      .wrap {
        max-width: 1400px;
        margin: 0 auto;
        padding: 40px 24px 80px;
      }

      .hero {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 32px;
        align-items: center;
        min-height: 82vh;
        background: linear-gradient(135deg, #fffaf0 0%, #f8dce0 30%, #dfeeff 100%);
        border: 4px solid rgba(217, 4, 41, 0.15);
        border-radius: 40px;
        padding: 36px;
        box-shadow: 0 30px 80px rgba(30, 41, 59, 0.18);
      }

      .badge {
        display: inline-block;
        background: linear-gradient(135deg, #d90429, #8b0a1a);
        color: #fff;
        padding: 12px 22px;
        border-radius: 999px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 18px;
        font-size: 14px;
        box-shadow: 0 14px 24px rgba(217, 4, 41, 0.3);
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 6vw, 7rem);
        line-height: 0.9;
        letter-spacing: -0.06em;
        text-transform: uppercase;
        font-weight: 900;
        color: #0f172a;
        text-shadow: 0 2px 0 rgba(255,255,255,0.7);
      }

      .role {
        margin-top: 20px;
        font-size: clamp(1.2rem, 2vw, 2.3rem);
        line-height: 1.3;
        font-weight: 800;
        color: #111827;
        text-transform: uppercase;
      }

      .party {
        margin-top: 12px;
        font-size: clamp(1rem, 1.6vw, 1.4rem);
        font-weight: 700;
        letter-spacing: 0.05em;
        color: #1d4ed8;
        text-transform: uppercase;
      }

      .profile-box {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ffe7a8 0%, #fff9f0 40%, #dfeeff 100%);
        border-radius: 32px;
        overflow: visible;
        box-shadow: 0 30px 60px rgba(15, 23, 42, 0.2);
        border: 5px solid rgba(17, 24, 39, 0.08);
        padding: 14px;
        min-height: 760px;
      }

      .profile-box::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
        pointer-events: none;
      }

      .profile-box img {
        max-width: 100%;
        max-height: 760px;
        width: auto;
        height: auto;
        display: block;
        border-radius: 24px;
       
        object-fit: cover;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 18px;
        margin-top: 22px;
      }

      .gallery img {
        width: 100%;
        height: 360px;
        object-fit: cover;
        border-radius: 18px;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
      }

      @media (max-width: 900px) {
        .hero {
          grid-template-columns: 1fr;
        }

        .profile-box img {
          height: 520px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="hero">
        <div>
          <div class="badge">BJP • KAUSHAMBI</div>
          <h1>कल्पना सोनकर</h1>
          <div class="role">अध्यक्ष जिला पंचायत कौशाम्बी (उत्तर प्रदेश)</div>
          <div class="party">भारतीय जनता पार्टी (BJP)</div>
        </div>

        <div class="profile-box">
          <img src="./public/Kalpana.jpeg" alt="Kalpana Sonkar" />
        </div>
      </section>

      <div class="gallery">
        <img src="./public/Kalpana1.jpeg" alt="Kalpana Sonkar 1" />
        <img src="./public/Kalpana2.jpeg" alt="Kalpana Sonkar 2" />
        <img src="./public/Kalpana3.jpeg" alt="Kalpana Sonkar 3" />
      </div>
    </div>
  </body>
</html>
