<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalpana Sonkar | Hero Section</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;700;800;900&display=swap');

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: #c7dff7;
        font-family: 'Noto Sans Devanagari', 'Inter', sans-serif;
      }

      .page {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 18px;
      }

      .shell {
        width: min(100%, 1100px);
        background: #f3f4ef;
        border: 8px solid #d9e8f9;
        border-radius: 24px;
        padding: 18px 18px 12px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.15);
      }

      .layout {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        gap: 20px;
        align-items: center;
      }

      .photo-wrap {
        width: 100%;
        background: linear-gradient(135deg, #4b4b4b 0%, #2e2e2e 100%);
        border-radius: 18px;
        overflow: hidden;
        border: 6px solid #f1d867;
      }

      .photo-wrap img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 80vh;
        object-fit: cover;
        object-position: center top;
        background: #3a3a3a;
      }

      .info {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .badge {
        display: inline-block;
        align-self: flex-start;
        background: linear-gradient(135deg, #1d4ed8, #0f172a);
        color: #fff;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: 700;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 4vw, 5rem);
        line-height: 1.08;
        color: #0f172a;
        font-weight: 900;
        letter-spacing: 0.02em;
      }

      .subtitle {
        margin-top: 16px;
        padding-top: 10px;
        border-top: 2px solid rgba(15, 23, 42, 0.7);
        font-size: clamp(1.1rem, 2vw, 2rem);
        line-height: 1.4;
        color: #0f172a;
        font-weight: 700;
      }

      .status {
        margin-top: 18px;
        padding-top: 12px;
        border-top: 2px solid rgba(15, 23, 42, 0.7);
        font-family: 'Inter', sans-serif;
        font-size: clamp(0.9rem, 1.5vw, 1.5rem);
        line-height: 1.4;
        font-weight: 700;
        color: #111827;
      }

      @media (max-width: 700px) {
        .page {
          padding: 12px;
        }

        .shell {
          border-width: 6px;
          padding: 10px 10px 12px;
          border-radius: 18px;
        }

        .layout {
          grid-template-columns: 1fr;
          gap: 12px;
        }

        .photo-wrap {
          border-width: 4px;
        }

        .photo-wrap img {
          max-height: none;
        }

        .badge {
          font-size: 10px;
          letter-spacing: 0.1em;
          padding: 8px 12px;
          margin-bottom: 12px;
        }

        h1 {
          font-size: clamp(2rem, 10vw, 3rem);
        }

        .subtitle {
          font-size: clamp(1rem, 4vw, 1.5rem);
        }

        .status {
          font-size: clamp(0.8rem, 3.2vw, 1.1rem);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="shell">
        <div class="layout">
          <div class="photo-wrap">
            <img src="./public/Kalpana.jpeg" alt="Kalpana Sonkar" />
          </div>

          <div class="info">
            <div class="badge">BJP • KAUSHAMBI</div>
            <h1>कल्पना सोनकर</h1>
            <div class="subtitle">अध्यक्ष जिला पंचायत कौशाम्बी (उत्तर प्रदेश)</div>
            <div class="status">Website is Under Development ! Launch within 30 Days</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
